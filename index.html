<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana Poster</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="Poster canvas">
        <div class="canvas" id="canvas">
          <div class="poster-artboard" id="poster-artboard">
            <div class="poster-stage" aria-hidden="true">
              <img
                id="poster-texture"
                class="poster-texture"
                alt=""
                width="3739"
                height="4800"
                draggable="false"
                decoding="async"
                crossorigin="anonymous"
                src="./textures/banana-poster-texture.jpg"
              />
            </div>
            <div id="banana-layer" class="banana-layer"></div>
            <div id="shape-layer" class="shape-layer"></div>
            <div id="sticker-layer" class="sticker-layer"></div>
          </div>
          <div class="canvas-ui-chrome">
          <div
            class="placed-inline"
            id="placed-inline"
            role="group"
            aria-label="Selection controls"
            hidden
          >
            <div
              class="placed-inline-bruise"
              id="placed-inline-bruise"
              role="group"
              aria-label="Bruise"
              hidden
            >
              <button
                type="button"
                class="placed-inline-btn"
                id="inline-bruise-minus"
                aria-label="Less bruise"
              >
                <span aria-hidden="true">−</span>
              </button>
              <span class="placed-inline-label">Bruise</span>
              <button
                type="button"
                class="placed-inline-btn"
                id="inline-bruise-plus"
                aria-label="More bruise"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </div>
          <div
            class="shape-color-picker"
            id="shape-color-picker"
            role="group"
            aria-label="Shape color"
            hidden
          >
            <div class="hsv-sv" id="hsv-sv" tabindex="0" aria-label="Saturation and brightness">
              <span class="hsv-sv-pointer" id="hsv-sv-pointer" aria-hidden="true"></span>
            </div>
            <div class="hsv-hue" id="hsv-hue" tabindex="0" aria-label="Hue">
              <span class="hsv-hue-pointer" id="hsv-hue-pointer" aria-hidden="true"></span>
            </div>
          </div>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Controls">
        <section class="side-tool-panel is-collapsed" id="banana-panel">
          <button
            type="button"
            class="side-tool-toggle"
            id="banana-toggle"
            aria-expanded="false"
            aria-controls="banana-tray-wrap"
          >
            <span class="side-tool-toggle-spacer" aria-hidden="true"></span>
            <span class="side-tool-title">Banana</span>
            <span class="side-tool-chevron" aria-hidden="true"></span>
          </button>
          <div class="side-tool-tray-wrap" id="banana-tray-wrap" hidden>
            <div class="side-tool-tray banana-tray">
              <button
                type="button"
                class="banana-place-thumb"
                id="banana-place"
                aria-label="Add banana to poster"
              >
                <img
                  id="banana-tool-preview"
                  src="./frames/banana-12.png"
                  alt="Banana preview"
                  draggable="false"
                />
              </button>
            </div>
          </div>
        </section>

        <section class="side-tool-panel is-collapsed" id="stickers-panel">
          <button
            type="button"
            class="side-tool-toggle"
            id="stickers-toggle"
            aria-expanded="false"
            aria-controls="stickers-tray-wrap"
          >
            <span class="side-tool-toggle-spacer" aria-hidden="true"></span>
            <span class="side-tool-title">Stickers</span>
            <span class="side-tool-chevron" aria-hidden="true"></span>
          </button>
          <div class="side-tool-tray-wrap" id="stickers-tray-wrap" hidden>
            <div class="side-tool-tray stickers-tray" id="sticker-library" role="list"></div>
          </div>
        </section>

        <section class="side-tool-panel is-collapsed" id="shapes-panel">
          <button
            type="button"
            class="side-tool-toggle"
            id="shapes-toggle"
            aria-expanded="false"
            aria-controls="shapes-tray-wrap"
          >
            <span class="side-tool-toggle-spacer" aria-hidden="true"></span>
            <span class="side-tool-title">Shapes</span>
            <span class="side-tool-chevron" aria-hidden="true"></span>
          </button>
          <div class="side-tool-tray-wrap" id="shapes-tray-wrap" hidden>
            <div class="side-tool-tray shapes-tray" id="shape-library" role="list"></div>
          </div>
        </section>

        <section class="side-tool-panel is-collapsed" id="export-panel">
          <button
            type="button"
            class="side-tool-toggle"
            id="export-toggle"
            aria-expanded="false"
            aria-controls="export-tray-wrap"
          >
            <span class="side-tool-toggle-spacer" aria-hidden="true"></span>
            <span class="side-tool-title">Export</span>
            <span class="side-tool-chevron" aria-hidden="true"></span>
          </button>
          <div class="side-tool-tray-wrap" id="export-tray-wrap" hidden>
            <div class="side-tool-tray export-tray">
              <div class="export-form">
                <label class="export-field">
                  <span class="export-label">Format</span>
                  <select id="export-format" class="export-select">
                    <option value="jpg">JPG</option>
                    <option value="pdf">PDF</option>
                  </select>
                </label>
                <label class="export-field">
                  <span class="export-label">Resolution</span>
                  <select id="export-dpi" class="export-select">
                    <option value="300">300 dpi</option>
                    <option value="600">600 dpi</option>
                  </select>
                </label>
                <button type="button" class="export-download-btn" id="export-download">
                  Download collage
                </button>
              </div>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
