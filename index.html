<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana Poster</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="Poster canvas">
        <div class="canvas" id="canvas">
          <div class="poster-stage" aria-hidden="true">
            <img
              id="poster-texture"
              class="poster-texture"
              alt=""
              width="1552"
              height="2000"
              draggable="false"
              decoding="async"
              src="./textures/banana-poster-texture.jpg"
            />
          </div>
          <div id="banana-layer" class="banana-layer"></div>
          <div id="sticker-layer" class="sticker-layer"></div>
          <div
            class="placed-inline"
            id="placed-inline"
            role="group"
            aria-label="Selection controls"
            hidden
          >
            <div class="placed-inline-size" role="group" aria-label="Size">
              <button
                type="button"
                class="placed-inline-btn"
                id="inline-scale-minus"
                aria-label="Smaller"
              >
                <span aria-hidden="true">−</span>
              </button>
              <button
                type="button"
                class="placed-inline-btn"
                id="inline-scale-plus"
                aria-label="Larger"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
            <div
              class="placed-inline-bruise"
              id="placed-inline-bruise"
              role="group"
              aria-label="Bruise"
              hidden
            >
              <button
                type="button"
                class="placed-inline-btn"
                id="inline-bruise-minus"
                aria-label="Less bruise"
              >
                <span aria-hidden="true">−</span>
              </button>
              <span class="placed-inline-bruise-label">Bruise</span>
              <button
                type="button"
                class="placed-inline-btn"
                id="inline-bruise-plus"
                aria-label="More bruise"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Controls">
        <section class="side-tool-panel is-collapsed" id="banana-panel">
          <button
            type="button"
            class="side-tool-toggle"
            id="banana-toggle"
            aria-expanded="false"
            aria-controls="banana-tray-wrap"
          >
            <span class="side-tool-toggle-spacer" aria-hidden="true"></span>
            <span class="side-tool-title">Banana</span>
            <span class="side-tool-chevron" aria-hidden="true"></span>
          </button>
          <div class="side-tool-tray-wrap" id="banana-tray-wrap" hidden>
            <div class="side-tool-tray banana-tray">
              <button
                type="button"
                class="banana-place-thumb"
                id="banana-place"
                aria-label="Add banana to poster"
              >
                <img
                  id="banana-tool-preview"
                  src="./frames/banana-12.png"
                  alt="Banana preview"
                  draggable="false"
                />
              </button>
            </div>
          </div>
        </section>

        <section class="side-tool-panel is-collapsed" id="stickers-panel">
          <button
            type="button"
            class="side-tool-toggle"
            id="stickers-toggle"
            aria-expanded="false"
            aria-controls="stickers-tray-wrap"
          >
            <span class="side-tool-toggle-spacer" aria-hidden="true"></span>
            <span class="side-tool-title">Stickers</span>
            <span class="side-tool-chevron" aria-hidden="true"></span>
          </button>
          <div class="side-tool-tray-wrap" id="stickers-tray-wrap" hidden>
            <div class="side-tool-tray stickers-tray" id="sticker-library" role="list"></div>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
