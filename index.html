<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana Editor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="Banana canvas">
        <div class="canvas" id="canvas">
          <div class="banana-stage" aria-hidden="false">
            <img
              id="banana"
              class="banana"
              alt="Banana"
              width="1512"
              height="865"
              draggable="false"
              decoding="sync"
              src="./frames/banana-00.png"
            />
          </div>
          <div id="sticker-layer" class="sticker-layer"></div>
          <div
            class="sticker-scale-inline"
            id="sticker-scale-inline"
            role="group"
            aria-label="Sticker size"
            hidden
          >
            <button
              type="button"
              class="sticker-scale-inline-btn"
              id="sticker-scale-inline-minus"
              aria-label="Smaller sticker"
            >
              <span aria-hidden="true">−</span>
            </button>
            <button
              type="button"
              class="sticker-scale-inline-btn"
              id="sticker-scale-inline-plus"
              aria-label="Larger sticker"
            >
              <span aria-hidden="true">+</span>
            </button>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Controls">
        <div class="bruise" role="group" aria-label="Bruise control">
          <button type="button" class="bruise-btn" id="bruise-minus" aria-label="Less bruise">
            <span aria-hidden="true">−</span>
          </button>
          <span class="bruise-label">Bruise</span>
          <button type="button" class="bruise-btn" id="bruise-plus" aria-label="More bruise">
            <span aria-hidden="true">+</span>
          </button>
        </div>

        <section class="stickers-panel is-collapsed" id="stickers-panel">
          <button
            type="button"
            class="stickers-toggle"
            id="stickers-toggle"
            aria-expanded="false"
            aria-controls="stickers-tray-wrap"
          >
            <span class="stickers-toggle-spacer" aria-hidden="true"></span>
            <span class="stickers-title">Stickers</span>
            <span class="stickers-chevron" aria-hidden="true"></span>
          </button>
          <div class="stickers-tray-wrap" id="stickers-tray-wrap" hidden>
            <div class="stickers-tray" id="sticker-library" role="list"></div>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
